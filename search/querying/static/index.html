<html>
    <head>
        <title>Orion Search</title>
        <link rel="stylesheet" href="/style.css">
    </head>
    <body>
        <div class="landing">
            <div class="logo">
                <img src="/big_logo.png" class="big-logo" alt="Orion Search Logo">
            </div>
            <form action="/search">
            <div style="text-align:center">
                <input name="q" autofocus placeholder="Search for npm packages..." class="search-box">
                <br>
                <div>
                    <button type="submit" class="btn-search">Search</button>
                    <a href="/status" class="btn-search">Debug</a>
                </div>
            </div>
            </form>
        </div>
    </body>
</html>
