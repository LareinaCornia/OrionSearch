<html>
    <head>
        <title>{{QUERY}} - Orion Search</title>
        <link rel="stylesheet" href="/style.css">
    </head>
    <body>
        <div class="results-header">
            <form action="/search">
                <a href="/" class="results-logo">
                    <img alt="Orion Search Logo" src="/logo.png">
                </a>
                <input name="q" value="{{QUERY}}" class="search-box-sm">
                <button type="submit" class="btn-blue">Search</button>
            </form>
        </div>
        <div class="results-body">
            {{SUGGEST}}
            <div class="results-count">{{COUNT}} results</div>
            {{RESULTS}}
        </div>
    </body>
</html>
